<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#173b32">
  <title>Neo Beauty — управление студией</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --pine: #173b32;
      --pine-dark: #102e27;
      --pine-soft: #e7eee9;
      --gold: #bd9455;
      --gold-pale: #f2eadc;
      --paper: #f8f7f3;
      --white: #fffefa;
      --ink: #232a26;
      --muted: #858b84;
      --line: #e9e8e2;
      --coral: #cb7867;
      --sky: #8aaab0;
      --lavender: #a49ab1;
      --shadow: 0 12px 32px rgba(27, 44, 35, .07);
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'DM Sans', sans-serif; font-size: 13px; }
    button, input, select, textarea { font: inherit; }
    button { color: inherit; }
    .app-shell { min-height: 100vh; }
    .sidebar { width: 248px; background: var(--pine); color: #eff3ed; position: fixed; inset: 0 auto 0 0; display: flex; flex-direction: column; padding: 25px 15px 16px; z-index: 10; }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 26px; }
    .brand-mark { width: 35px; height: 35px; border: 1px solid rgba(219, 189, 137, .7); color: #e6cb99; display: grid; place-items: center; border-radius: 11px; font: 700 14px Manrope, sans-serif; letter-spacing: 0; }
    .brand-name { font: 800 15px Manrope, sans-serif; letter-spacing: 0; }
    .brand-caption { margin-top: 2px; color: #aebdb3; font-size: 10px; }
    .studio-switch { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; margin: 0 1px 23px; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: rgba(255,255,255,.055); }
    .studio-switch small { display: block; color: #aebdb3; font-size: 10px; margin-bottom: 4px; }
    .studio-switch strong { font-size: 12px; font-weight: 600; }
    .switch-arrow { color: #d7c097; font-size: 15px; }
    .nav-label { text-transform: uppercase; letter-spacing: 1.2px; font-size: 9px; font-weight: 700; color: #8fa59a; padding: 0 12px 9px; }
    .nav-list { display: grid; gap: 4px; }
    .nav-item { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; border-radius: 7px; background: transparent; text-align: left; color: #c7d2ca; cursor: pointer; transition: background .18s, color .18s; }
    .nav-item:hover { background: rgba(255,255,255,.08); color: white; }
    .nav-item.active { color: #fff; background: rgba(255,255,255,.13); box-shadow: inset 2px 0 #d5b77f; }
    .nav-icon { width: 17px; text-align: center; color: #d5b77f; font-size: 15px; }
    .nav-count { margin-left: auto; padding: 2px 7px; border-radius: 12px; background: rgba(255,255,255,.13); font-size: 10px; }
    .sidebar-bottom { margin-top: auto; }
    .setup-card { margin: 0 2px 17px; padding: 13px; border: 1px solid rgba(255,255,255,.12); border-radius: 8px; background: rgba(255,255,255,.055); }
    .setup-card-top { display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; }
    .setup-card-top span:last-child { color: #dfc18c; }
    .setup-track { height: 4px; background: rgba(255,255,255,.14); border-radius: 4px; margin: 11px 0 8px; overflow: hidden; }
    .setup-track span { display: block; width: 68%; height: 100%; background: #d3b67e; }
    .setup-card small { color: #aebdb3; font-size: 10px; }
    .profile-mini { padding: 13px 9px 0; border-top: 1px solid rgba(255,255,255,.12); display: flex; align-items: center; gap: 10px; }
    .avatar { flex: 0 0 auto; display: grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; color: var(--pine); background: #e6d7bd; font-size: 11px; font-weight: 700; }

    .profile-mini strong { display: block; font-size: 11px; font-weight: 600; }
    .profile-mini small { color: #aebdb3; font-size: 10px; }
    .main-area { min-height: 100vh; margin-left: 248px; }
    .topbar { height: 66px; position: sticky; top: 0; z-index: 5; background: rgba(255,254,250,.94); border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 34px; backdrop-filter: blur(14px); }
    .crumbs { color: var(--muted); font-size: 12px; }
    .crumbs strong { color: var(--ink); font-weight: 600; }
    .top-actions { display: flex; align-items: center; gap: 17px; }
    .location { color: #626a63; font-size: 11px; }
    .icon-button { width: 34px; height: 34px; display: grid; place-items: center; position: relative; border: 1px solid var(--line); background: transparent; border-radius: 7px; cursor: pointer; font-size: 15px; }
    .icon-button:hover { background: var(--paper); }
    .notify-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); position: absolute; top: 7px; right: 7px; border: 1px solid white; }
    .content { max-width: 1500px; margin: 0 auto; padding: 29px 34px 48px; }
    .page-heading { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 23px; }
    .eyebrow { color: var(--gold); text-transform: uppercase; letter-spacing: 1.25px; font-size: 9px; font-weight: 700; margin-bottom: 7px; }
    h1 { margin: 0; font: 700 24px/1.2 Manrope, sans-serif; letter-spacing: 0; }
    .page-subtitle { margin: 6px 0 0; color: var(--muted); font-size: 12px; }
    .heading-actions { display: flex; align-items: center; gap: 9px; }
    .btn { border: 1px solid var(--line); background: var(--white); border-radius: 6px; padding: 9px 13px; font-weight: 600; font-size: 11px; cursor: pointer; transition: background .16s, transform .16s; }
    .btn:hover { background: #f2f1eb; }
    .btn:active { transform: translateY(1px); }
    .btn-primary { border-color: var(--pine); background: var(--pine); color: white; }
    .btn-primary:hover { background: var(--pine-dark); }
    .btn-gold { border-color: #d5c3a2; background: var(--gold-pale); color: #71572e; }
    .btn-danger { color: #a85041; }
    .btn-small { padding: 6px 9px; font-size: 10px; }
    .metric-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 19px; }
    .metric { background: var(--white); border: 1px solid var(--line); border-radius: 7px; padding: 15px 16px 13px; position: relative; overflow: hidden; }
    .metric::after { content: ''; position: absolute; top: 0; right: 0; width: 3px; height: 100%; background: var(--metric-color, var(--gold)); }
    .metric-label { color: var(--muted); font-size: 10px; }
    .metric-value { font: 700 21px Manrope, sans-serif; letter-spacing: 0; margin-top: 8px; }
    .metric-note { margin-top: 5px; font-size: 10px; color: #738178; }
    .metric-note strong { color: #57816a; font-weight: 600; }
    .metric-icon { position: absolute; top: 12px; right: 15px; color: var(--metric-color, var(--gold)); font-size: 15px; }
    .panel { background: var(--white); border: 1px solid var(--line); border-radius: 7px; }
    .schedule-panel { overflow: hidden; }
    .panel-toolbar { min-height: 57px; padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
    .panel-title { font: 700 13px Manrope, sans-serif; letter-spacing: 0; }
    .panel-title small { display: block; color: var(--muted); font: 400 10px 'DM Sans', sans-serif; margin-top: 4px; }
    .toolbar-group { display: flex; align-items: center; gap: 7px; }
    .date-switch { display: flex; align-items: center; gap: 7px; }
    .date-switch strong { min-width: 135px; text-align: center; font-size: 11px; font-weight: 600; }
    .square-btn { width: 29px; height: 29px; border: 1px solid var(--line); background: white; border-radius: 5px; cursor: pointer; }
    .square-btn:hover { background: var(--paper); }
    .segmented { display: flex; padding: 3px; border-radius: 6px; background: #f1f0eb; gap: 2px; }
    .segmented button { border: 0; background: transparent; padding: 6px 9px; border-radius: 4px; color: var(--muted); font-size: 10px; cursor: pointer; }
    .segmented button.active { background: white; color: var(--pine); box-shadow: 0 1px 3px rgba(0,0,0,.09); font-weight: 600; }
    .staff-legend { display: flex; align-items: center; gap: 15px; padding: 9px 16px; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .staff-chip { display: inline-flex; align-items: center; gap: 6px; color: #727970; white-space: nowrap; font-size: 10px; }
    .staff-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--staff-color); }
    .calendar-scroll { overflow: auto; max-height: 545px; }
    .calendar { display: grid; min-width: 820px; grid-template-columns: 52px repeat(4, minmax(170px, 1fr)); }
    .calendar-head { position: sticky; top: 0; z-index: 2; background: #fffefa; height: 52px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); }
    .calendar-head:first-child { left: 0; z-index: 3; }
    .calendar-head strong { font-size: 11px; font-weight: 600; }
    .calendar-head small { color: var(--muted); font-size: 9px; display: block; margin-top: 3px; font-weight: 400; }
    .calendar-head.today { background: #f5f3ec; }
    .time-column { position: sticky; left: 0; z-index: 1; background: var(--white); }
    .time-cell { height: 65px; border-right: 1px solid var(--line); position: relative; color: #969b94; font-size: 9px; text-align: center; padding-top: 0; }
    .time-cell span { position: relative; top: -6px; background: var(--white); padding: 0 3px; }
    .day-column { height: 585px; position: relative; border-right: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 64px, #efeee8 64px, #efeee8 65px); }
    .day-column:last-child { border-right: 0; }
    .appointment { position: absolute; left: 5px; right: 5px; min-height: 56px; padding: 7px 8px; border-left: 3px solid var(--appt-color); background: var(--appt-bg); border-radius: 4px; overflow: hidden; cursor: pointer; transition: filter .15s, transform .15s; }
    .appointment:hover { filter: saturate(1.16); transform: translateX(1px); }
    .appointment-time { color: #59635c; font-size: 9px; font-weight: 600; }
    .appointment-name { color: #27332c; font-size: 10px; font-weight: 700; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .appointment-service { color: #667168; font-size: 9px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now-line { position: absolute; z-index: 1; left: 0; right: 0; top: 220px; border-top: 1px solid var(--coral); pointer-events: none; }
    .now-line::before { content: ''; width: 6px; height: 6px; position: absolute; top: -4px; left: -1px; border-radius: 50%; background: var(--coral); }
    .below-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 14px; margin-top: 16px; }
    .simple-panel { padding: 15px 16px; }
    .simple-panel .panel-title { margin-bottom: 13px; }
    .list-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); }
    .list-row:first-of-type { border-top: 0; }
    .row-person { display: flex; align-items: center; gap: 9px; min-width: 0; }
    .row-person strong { display: block; font-size: 10px; font-weight: 600; }
    .row-person small { display: block; color: var(--muted); font-size: 9px; margin-top: 3px; }
    .mini-avatar { width: 29px; height: 29px; display: grid; place-items: center; flex: 0 0 auto; border-radius: 50%; background: var(--mini-bg, var(--pine-soft)); color: var(--pine); font-size: 9px; font-weight: 700; }
    .status { padding: 4px 7px; border-radius: 12px; background: #e7efe8; color: #50745b; font-size: 9px; white-space: nowrap; }
    .status.waiting { background: #f5eedf; color: #94723d; }
    .status.cancelled { background: #f7e8e3; color: #a85c4d; }
    .status.active { background: #e7efe8; color: #50745b; }
    .search-box { display: flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: white; border-radius: 6px; padding: 7px 9px; color: var(--muted); }
    .search-box input { width: 170px; min-width: 0; border: 0; outline: none; background: transparent; font-size: 10px; color: var(--ink); }
    .data-panel { overflow: hidden; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; text-align: left; }
    th { background: #f7f6f1; color: #838a81; text-transform: uppercase; letter-spacing: .7px; font-size: 9px; font-weight: 700; padding: 11px 15px; white-space: nowrap; }
    td { padding: 12px 15px; border-top: 1px solid var(--line); font-size: 11px; white-space: nowrap; }
    tbody tr:hover { background: #fbfaf7; }
    .person-cell { display: flex; align-items: center; gap: 9px; }
    .person-cell strong { font-weight: 600; }
    .cell-sub { color: var(--muted); font-size: 9px; margin-top: 3px; }
    .table-footer { display: flex; justify-content: space-between; color: var(--muted); padding: 12px 15px; font-size: 10px; border-top: 1px solid var(--line); }
    .team-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
    .team-card { background: var(--white); border: 1px solid var(--line); border-radius: 7px; padding: 16px; }
    .team-card-head { display: flex; align-items: center; gap: 11px; }
    .team-card .mini-avatar { width: 40px; height: 40px; font-size: 11px; }
    .team-card h3 { font: 700 12px Manrope, sans-serif; margin: 0; letter-spacing: 0; }
    .team-card p { color: var(--muted); font-size: 10px; margin: 4px 0 0; }
    .team-stats { display: flex; justify-content: space-between; border-top: 1px solid var(--line); margin-top: 14px; padding-top: 12px; color: var(--muted); font-size: 10px; }
    .team-stats strong { display: block; color: var(--ink); font-size: 13px; margin-bottom: 3px; }
    .split-layout { display: grid; grid-template-columns: 1.1fr .9fr; gap: 14px; }
    .chart { height: 210px; padding: 15px 16px 10px; display: flex; align-items: end; gap: 13px; border-top: 1px solid var(--line); background: repeating-linear-gradient(to bottom, transparent 0, transparent 51px, #eeede6 52px); }
    .chart-column { flex: 1; display: flex; flex-direction: column; justify-content: end; align-items: center; gap: 8px; height: 100%; }
    .chart-bar { width: min(34px, 75%); min-height: 8px; border-radius: 4px 4px 0 0; background: var(--bar-color, var(--pine)); position: relative; animation: grow .65s ease both; transform-origin: bottom; }
    .chart-bar span { position: absolute; top: -17px; left: 50%; transform: translateX(-50%); color: #6e766e; font-size: 9px; }
    .chart-column small { color: var(--muted); font-size: 9px; }
    @keyframes grow { from { transform: scaleY(.25); opacity: .4; } to { transform: scaleY(1); opacity: 1; } }
    .online-card { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 17px; border: 1px solid #dfe6df; border-radius: 7px; background: linear-gradient(115deg, #edf2ec, #fbf8ef); }
    .online-card h2 { font: 700 15px Manrope, sans-serif; margin: 0 0 5px; letter-spacing: 0; }
    .online-card p { color: #737c73; font-size: 11px; margin: 0; }
    .toggle { width: 37px; height: 21px; padding: 2px; border: 0; border-radius: 12px; background: #b8c1b9; cursor: pointer; transition: background .2s; }
    .toggle::after { content: ''; display: block; width: 17px; height: 17px; border-radius: 50%; background: white; transition: transform .2s; }
    .toggle.on { background: var(--pine); }
    .toggle.on::after { transform: translateX(16px); }
    .booking-url { display: flex; align-items: center; gap: 8px; margin-top: 15px; padding: 9px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--white); color: #656d66; font-size: 10px; }
    .booking-url span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
    .settings-note { padding: 11px 13px; background: #f7f3e9; border-left: 3px solid var(--gold); color: #706344; font-size: 10px; line-height: 1.6; border-radius: 0 5px 5px 0; }
    .modal-backdrop { position: fixed; inset: 0; display: none; place-items: center; z-index: 30; padding: 16px; background: rgba(16, 36, 29, .48); backdrop-filter: blur(3px); }
    .modal-backdrop.open { display: grid; animation: fade-in .15s ease both; }
    @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
    .modal { width: min(100%, 500px); max-height: min(90vh, 720px); overflow-y: auto; padding: 22px; border-radius: 9px; background: var(--white); box-shadow: 0 25px 70px rgba(0,0,0,.2); animation: modal-in .2s ease both; }
    @keyframes modal-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    .modal-head { display: flex; align-items: start; justify-content: space-between; margin-bottom: 18px; }
    .modal-head h2 { margin: 0; font: 700 17px Manrope, sans-serif; letter-spacing: 0; }
    .modal-head p { color: var(--muted); font-size: 10px; margin: 5px 0 0; }
    .close-modal { width: 28px; height: 28px; border: 0; border-radius: 5px; background: #f2f1eb; cursor: pointer; font-size: 16px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: grid; gap: 6px; }
    .field.full { grid-column: 1 / -1; }
    .field label { color: #6e756e; font-size: 10px; font-weight: 600; }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid #e3e3dc; border-radius: 5px; padding: 9px 10px; outline: none; background: white; color: var(--ink); font-size: 11px; }
    .field input:focus, .field select:focus, .field textarea:focus { border-color: #8ba397; box-shadow: 0 0 0 2px rgba(23,59,50,.08); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 19px; }
    .toast { position: fixed; right: 25px; bottom: 24px; z-index: 40; padding: 11px 15px; border-radius: 6px; background: var(--pine-dark); color: white; font-size: 11px; box-shadow: var(--shadow); opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .empty-state { padding: 32px 15px; text-align: center; color: var(--muted); font-size: 11px; }
    .mobile-menu { display: none; }
    @media (max-width: 1100px) {
      .sidebar { width: 220px; }
      .main-area { margin-left: 220px; }
      .content { padding-left: 23px; padding-right: 23px; }
      .topbar { padding: 0 23px; }
      .team-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 760px) {
      .sidebar { width: 100%; height: 59px; inset: auto 0 0; padding: 5px 7px; flex-direction: row; overflow: auto; border-top: 1px solid rgba(255,255,255,.12); }
      .brand, .studio-switch, .nav-label, .sidebar-bottom { display: none; }
      .nav-list { display: flex; align-items: stretch; min-width: max-content; width: 100%; gap: 2px; }
      .nav-item { min-width: 66px; flex-direction: column; justify-content: center; gap: 2px; padding: 4px 5px; font-size: 9px; text-align: center; }
      .nav-icon { font-size: 15px; width: auto; }
      .nav-count { display: none; }
      .main-area { margin-left: 0; padding-bottom: 59px; }
      .topbar { height: 55px; padding: 0 15px; }
      .content { padding: 22px 15px 28px; }
      .page-heading { align-items: flex-start; flex-direction: column; margin-bottom: 16px; }
      h1 { font-size: 21px; }
      .heading-actions { width: 100%; }
      .heading-actions .btn-primary { margin-left: auto; }
      .metric-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
      .metric { padding: 12px; }
      .metric-value { font-size: 18px; }
      .panel-toolbar { align-items: flex-start; flex-direction: column; }
      .toolbar-group { width: 100%; justify-content: space-between; }
      .date-switch strong { min-width: 115px; }
      .below-grid, .split-layout { grid-template-columns: 1fr; }
      .team-grid { grid-template-columns: 1fr; }
      .search-box { flex: 1; }
      .search-box input { width: 100%; }
      .online-card { align-items: flex-start; }
      .location { display: none; }
      .table-panel-toolbar { align-items: stretch; }
      .form-grid { grid-template-columns: 1fr; }
      .field.full { grid-column: auto; }
      .toast { right: 12px; bottom: 72px; left: 12px; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">N</div>
        <div><div class="brand-name">neo beauty</div><div class="brand-caption">пространство заботы</div></div>
      </div>
      <div class="studio-switch"><div><small>ВАША СТУДИЯ</small><strong>Neo Beauty · Tallinn</strong></div><span class="switch-arrow">⌄</span></div>
      <div class="nav-label">Рабочее пространство</div>
      <nav class="nav-list" aria-label="Главное меню">
        <button class="nav-item active" data-view="schedule"><span class="nav-icon">▦</span>Журнал<span class="nav-count" id="nav-count">12</span></button>
        <button class="nav-item" data-view="clients"><span class="nav-icon">◉</span>Клиенты</button>
        <button class="nav-item" data-view="team"><span class="nav-icon">♧</span>Команда и услуги</button>
        <button class="nav-item" data-view="inventory"><span class="nav-icon">▤</span>Склад</button>
        <button class="nav-item" data-view="finance"><span class="nav-icon">◫</span>Финансы и отчёты</button>
        <button class="nav-item" data-view="booking"><span class="nav-icon">↗</span>Онлайн-запись</button>
      </nav>
      <div class="sidebar-bottom">
        <div class="setup-card"><div class="setup-card-top"><span>Настройка студии</span><span>68%</span></div><div class="setup-track"><span></span></div><small>Ещё 2 шага до запуска</small></div>
        <div class="profile-mini"><div class="avatar">ЕК</div><div><strong>Елена Кузнецова</strong><small>Владелец студии</small></div></div>
      </div>
    </aside>

    catch { appointments = defaultAppointments; }

    let toastTimer;
    const root = document.getElementById('view-root');
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[char]);
    const money = (value) => new Intl.NumberFormat('ru-RU', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 }).format(value);
    const dateLabel = (date, options) => new Intl.DateTimeFormat('ru-RU', options).format(date);
    const initials = (name) => name.split(/\s+/).slice(0, 2).map((part) => part[0] || '').join('').toUpperCase();
    const persist = () => localStorage.setItem('neoBeautyAppointments', JSON.stringify(appointments));
    const showToast = (message) => { const toast = document.getElementById('toast'); toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2400); };
    const setView = (view) => { currentView = view; searchQuery = ''; document.querySelectorAll('.nav-item').forEach((button) => button.classList.toggle('active', button.dataset.view === view)); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); };
    const heading = (eyebrow, title, subtitle, action = '') => `<div class="page-heading"><div><div class="eyebrow">${eyebrow}</div><h1>${title}</h1><p class="page-subtitle">${subtitle}</p></div><div class="heading-actions">${action}</div></div>`;
    const searchBox = (placeholder = 'Поиск') => `<label class="search-box"><span>⌕</span><input id="table-search" type="search" placeholder="${placeholder}" value="${escapeHtml(searchQuery)}" aria-label="${placeholder}"></label>`;
    const avatar = (label, bg = '#e7eee9') => `<span class="mini-avatar" style="--mini-bg:${bg}">${escapeHtml(label)}</span>`;
    const apptTimeMinutes = (time) => { const [hour, minute] = time.split(':').map(Number); return hour * 60 + minute; };

    function renderSchedule() {
      const dateString = currentDate.getFullYear() + '-' + String(currentDate.getMonth() + 1).padStart(2, '0') + '-' + String(currentDate.getDate()).padStart(2, '0');

      const totalRevenue = activeAppointments.reduce((sum, item) => sum + Number(item.price || 0), 0);
      const action = '<button class="btn" data-action="today">Сегодня</button><button class="btn btn-primary" data-action="new-appointment">＋ Новая запись</button>';

      html += `<section class="metric-grid"><article class="metric" style="--metric-color:#bd9455"><span class="metric-icon">▦</span><div class="metric-label">Записи сегодня</div><div class="metric-value">${activeAppointments.length}</div><div class="metric-note"><strong>+3</strong> к прошлой пятнице</div></article><article class="metric" style="--metric-color:#71917a"><span class="metric-icon">€</span><div class="metric-label">Плановая выручка</div><div class="metric-value">${money(totalRevenue)}</div><div class="metric-note">По подтверждённым записям</div></article><article class="metric" style="--metric-color:#8aaab0"><span class="metric-icon">◷</span><div class="metric-label">Свободные окна</div><div class="metric-value">7</div><div class="metric-note">Ближайшее · 12:00</div></article><article class="metric" style="--metric-color:#cb7867"><span class="metric-icon">◉</span><div class="metric-label">Новые клиенты</div><div class="metric-value">3</div><div class="metric-note">За последние 7 дней</div></article></section>`;
      html += `<section class="panel schedule-panel"><div class="panel-toolbar"><div class="panel-title">Расписание специалистов<small>Записи на ${dateLabel(currentDate, { day: 'numeric', month: 'long' })}</small></div><div class="toolbar-group"><div class="date-switch"><button class="square-btn" data-action="prev-date" aria-label="Предыдущий день">‹</button><strong>${dateLabel(currentDate, { day: 'numeric', month: 'long', year: 'numeric' })}</strong><button class="square-btn" data-action="next-date" aria-label="Следующий день">›</button></div><div class="segmented" id="calendar-mode">${['День', 'Неделя', 'Месяц'].map((mode) => `<button class="${calendarMode === mode ? 'active' : ''}" data-mode="${mode}">${mode}</button>`).join('')}</div></div></div>`;
      html += `<div class="staff-legend">${staff.map((person) => `<span class="staff-chip"><i class="staff-dot" style="--staff-color:${person.color}"></i>${person.name}</span>`).join('')}</div><div class="calendar-scroll"><div class="calendar"><div class="calendar-head"></div>`;
      staff.forEach((person) => { html += `<div class="calendar-head"><div>${avatar(person.initials, person.bg)}</div><div style="margin-left:7px"><strong>${person.name.split(' ')[0]}</strong><small>${person.role}</small></div></div>`; });
      html += '<div class="time-column">';
      for (let hour = 9; hour <= 17; hour++) html += `<div class="time-cell"><span>${String(hour).padStart(2, '0')}:00</span></div>`;

          const offset = Math.max(0, apptTimeMinutes(item.time) - 9 * 60);
          if (offset > 8 * 60) return;
          const top = offset / 60 * 65;
          const height = Math.max(58, Number(item.duration || 60) / 60 * 65 - 5);
          const statusLabel = item.status === 'waiting' ? ' · ожидает' : '';

        html += '</div>';

      return html;
    }

    function renderClients() {
      const filtered = clients.filter((client) => `${client.name} ${client.phone}`.toLowerCase().includes(searchQuery.toLowerCase()));

    function renderInventory() {

Списание материалов&nbsp; →</span></div></section>`;
    }

    function renderFinance() {
      const bars = [44, 57, 49, 72, 61, 78, 67, 90, 70, 82, 64, 96];
      return heading('ПОКАЗАТЕЛИ СТУДИИ', 'Финансы и отчёты', 'Сентябрь 2026 · все показатели в евро', '<button class="btn">Сентябрь 2026⌄</button><button class="btn" data-action="finance-export">↓ Экспорт отчёта</button>') + `<section class="metric-grid"><article class="metric" style="--metric-color:#71917a"><span class="metric-icon">€</span><div class="metric-label">Выручка за месяц</div><div class="metric-value">€ 8 420</div><div class="metric-note"><strong>↑ 12%</strong> к августу</div></article><article class="metric" style="--metric-color:#bd9455"><span class="metric-icon">◷</span><div class="metric-label">Завершённые визиты</div><div class="metric-value">146</div><div class="metric-note">из 158 записей</div></article><article class="metric" style="--metric-color:#8aaab0"><span class="metric-icon">◉</span><div class="metric-label">Средний чек</div><div class="metric-value">€ 57,67</div><div class="metric-note"><strong>↑ € 4,20</strong> к августу</div></article><article class="metric" style="--metric-color:#cb7867"><span class="metric-icon">↗</span><div class="metric-label">Возврат клиентов</div><div class="metric-value">72%</div><div class="metric-note">цель месяца · 75%</div></article></section><div class="split-layout"><section class="panel"><div class="panel-toolbar"><div class="panel-title">Динамика выручки<small>Последние 12 недель</small></div><span class="status active">+12% за месяц</span></div><div class="chart">${bars.map((height, index) => `<div class="chart-column"><div class="chart-bar" style="height:${height}%;--bar-color:${index === 11 ? '#bd9455' : '#557466'}"><span>${index === 11 ? '€1.2k' : ''}</span></div><small>${['07.07','14.07','21.07','28.07','04.08','11.08','18.08','25.08','01.09','08.09','15.09','22.09'][index]}</small></div>`).join('')}</div></section><section class="panel simple-panel"><div class="panel-title">Способы оплаты<small>Все транзакции · сентябрь</small></div><div class="list-row"><div class="row-person"><span class="mini-avatar">▣</span><div><strong>Банковская карта</strong><small>Терминал Aktiva Merit</small></div></div><strong>€ 6 020</strong></div><div class="list-row"><div class="row-person"><span class="mini-avatar" style="--mini-bg:#f2eadc">€</span><div><strong>Наличные</strong><small>7 транзакций</small></div></div><strong>€ 1 270</strong></div><div class="list-row"><div class="row-person"><span class="mini-avatar" style="--mini-bg:#e9f0f0">↗</span><div><strong>Банковский перевод</strong><small>4 транзакции</small></div></div><strong>€ 1 130</strong></div><div class="settings-note" style="margin-top:13px">Интеграция с Aktiva Merit не подключена. Данные оплаты показаны как пример для обсуждения будущей связки.</div></section></div>`;
    }

    function renderBooking() {
      const enabled = localStorage.getItem('neoBeautyBooking') !== 'false';
      return heading('ЗАПИСЬ ДЛЯ ГОСТЕЙ', 'Онлайн-запись', 'Клиенты выбирают услугу и удобное время самостоятельно', '<button class="btn btn-primary" data-action="preview-booking">Предпросмотр страницы</button>') + `<section class="online-card"><div><div class="eyebrow" style="margin-bottom:6px">СТРАНИЦА СТУДИИ</div><h2>Онлайн-запись Neo Beauty</h2><p>Таллин · бьюти, уход и SPA-ритуалы</p></div><div style="display:flex;align-items:center;gap:9px"><span id="booking-status-label" style="font-size:10px;color:#687268">${enabled ? 'Запись открыта' : 'Запись закрыта'}</span><button class="toggle ${enabled ? 'on' : ''}" data-action="toggle-booking" aria-label="Включить или выключить онлайн-запись" aria-pressed="${enabled}"></button></div></section><div class="split-layout" style="margin-top:14px"><section class="panel simple-panel"><div class="panel-title">Адрес страницы<small>Поделитесь ссылкой с клиентами</small></div><div class="booking-url"><span>neobeauty.ee/broneeri</span><button class="btn btn-small" data-action="copy-link">Копировать</button></div><div style="margin-top:14px;display:flex;gap:20px"><div><div class="metric-label">Просмотры за месяц</div><strong style="font-size:18px;display:block;margin-top:5px">248</strong></div><div><div class="metric-label">Записей онлайн</div><strong style="font-size:18px;display:block;margin-top:5px">38</strong></div><div><div class="metric-label">Конверсия</div><strong style="font-size:18px;display:block;margin-top:5px">15,3%</strong></div></div></section><section class="panel simple-panel"><div class="panel-title">Как проходит запись<small>Настройки для клиентов</small></div><div class="list-row"><div class="row-person"><span class="mini-avatar">1</span><div><strong>Клиент выбирает услугу</strong><small>Каталог и длительность визита</small></div></div><span class="status active">Активно</span></div><div class="list-row"><div class="row-person"><span class="mini-avatar">2</span><div><strong>Подбирает специалиста</strong><small>По имени или «любой мастер»</small></div></div><span class="status active">Активно</span></div><div class="list-row"><div class="row-person"><span class="mini-avatar">3</span><div><strong>Получает подтверждение</strong><small>SMS и email · интеграция позже</small></div></div><span class="status waiting">Настроить</span></div></section></div><div class="settings-note" style="margin-top:14px">Прототип русскоязычный. Страницу онлайн-записи позже можно дополнить эстонским языком и местными SMS-уведомлениями.</div>`;
    }

    function render() {
      const titles = { schedule: 'Журнал', clients: 'Клиенты', team: 'Команда и услуги', inventory: 'Склад', finance: 'Финансы и отчёты', booking: 'Онлайн-запись' };
      document.getElementById('crumb-current').textContent = titles[currentView];
      document.getElementById('nav-count').textContent = appointments.filter((item) => item.date === '2026-10-02').length;
      root.innerHTML = ({ schedule: renderSchedule, clients: renderClients, team: renderTeam, inventory: renderInventory, finance: renderFinance, booking: renderBooking })[currentView]();
      const search = document.getElementById('table-search');
      if (search) search.addEventListener('input', (event) => { searchQuery = event.target.value; const cursor = event.target.selectionStart; render(); const next = document.getElementById('table-search'); next.focus(); next.setSelectionRange(cursor, cursor); });
    }
    function openModal() { document.getElementById('appointment-modal').classList.add('open'); document.getElementById('booking-client').focus(); }
    function closeModal() { document.getElementById('appointment-modal').classList.remove('open'); }
    function addAppointment(form) {
      const data = new FormData(form);
      const staffIndex = Math.max(0, staff.findIndex((person) => person.name === data.get('staff')));
      const date = String(data.get('date'));
      const appointmentDate = new Date(`${date}T12:00:00`);
      appointments.push({ id: Date.now(), staff: staffIndex, day: appointmentDate.getDay(), date, time: String(data.get('time')), duration: 60, client: String(data.get('client')).trim(), service: String(data.get('service')), price: Number(data.get('price')), status: String(data.get('status')), note: String(data.get('note') || '') });
      persist(); currentDate = appointmentDate; closeModal(); form.reset(); document.getElementById('booking-date').value = date; render(); showToast('Запись добавлена в журнал');
    }
    document.addEventListener('click', async (event) => {
      const nav = event.target.closest('[data-view]');
      if (nav) return setView(nav.dataset.view);
      if (event.target.closest('[data-close-modal]')) return closeModal();
      const mode = event.target.closest('[data-mode]');
      if (mode) { calendarMode = mode.dataset.mode; if (calendarMode !== 'День') showToast(`${calendarMode}: вид календаря будет расширен в следующем этапе`); render(); return; }
      const confirm = event.target.closest('[data-confirm]');
      if (confirm) { const item = appointments.find((entry) => entry.id === Number(confirm.dataset.confirm)); if (item) { item.status = 'confirmed'; persist(); render(); showToast('Запись подтверждена'); } return; }
      const appointmentButton = event.target.closest('[data-appointment]');
      if (appointmentButton) { const item = appointments.find((entry) => entry.id === Number(appointmentButton.dataset.appointment)); if (item) showToast(`${item.client} · ${item.time} · ${money(item.price)}`); return; }
      const clientButton = event.target.closest('[data-client]');
      if (clientButton) { const client = clients.find((entry) => entry.name === clientButton.dataset.client); if (client) showToast(`${client.name} · ${client.visits} визитов · ${money(client.spent)} всего`); return; }
      const stockButton = event.target.closest('[data-stock]');
      if (stockButton) { showToast('Списание сохранено в демо-журнале'); stockButton.textContent = 'Списано'; stockButton.disabled = true; return; }
      const actionButton = event.target.closest('[data-action]');
      if (!actionButton) return;
      const action = actionButton.dataset.action;
      if (action === 'new-appointment') return openModal();
      if (action === 'today') { currentDate = new Date(2026, 9, 2); render(); return; }
      if (action === 'prev-date' || action === 'next-date') { currentDate.setDate(currentDate.getDate() + (action === 'prev-date' ? -1 : 1)); render(); return; }
      if (action === 'toggle-booking') { const enabled = localStorage.getItem('neoBeautyBooking') !== 'false'; localStorage.setItem('neoBeautyBooking', String(!enabled)); render(); showToast(!enabled ? 'Онлайн-запись открыта' : 'Онлайн-запись закрыта'); return; }
      if (action === 'copy-link') { try { await navigator.clipboard.writeText('https://neobeauty.ee/broneeri'); showToast('Ссылка скопирована'); } catch { showToast('Ссылка: neobeauty.ee/broneeri'); } return; }
      const messages = { 'add-client': 'Форма добавления клиента будет следующим этапом', 'add-service': 'Форма новой услуги будет следующим этапом', 'invite-staff': 'Приглашение мастера будет следующим этапом', 'add-stock': 'Приход товара будет следующим этапом', 'inventory-report': 'Отчёт по складу подготовлен для экспорта', 'finance-export': 'Финансовый отчёт подготовлен для экспорта', 'preview-booking': 'Предпросмотр клиентской страницы будет следующим этапом' };
      if (messages[action]) showToast(messages[action]);
    });
    document.getElementById('appointment-form').addEventListener('submit', (event) => { event.preventDefault(); addAppointment(event.currentTarget); });
    document.getElementById('appointment-modal').addEventListener('click', (event) => { if (event.target.id === 'appointment-modal') closeModal(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape') closeModal(); });
    render();
  </script>
</body>
